<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생물 게임 프로토타입</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background-color: #1a1a1a; border: 2px solid #444; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { x: 100, y: 200, radius: 15, speed: 2.5 };
        let cameraX = 0;
        let blocks = [
            { x: 300, type: 'Na', color: '#39ff14' },
            { x: 550, type: 'K',  color: '#ffea00' },
            { x: 800, type: 'Na', color: '#39ff14' }
        ];
        function animate() {
            player.x += player.speed;
            cameraX = player.x - 150;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 210, player.x + 1000, 20);
            blocks.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, 210, 60, 20);
                ctx.fillStyle = 'black';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(b.type === 'Na' ? 'Na+' : 'K+', b.x + 15, 225);
            });
            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
